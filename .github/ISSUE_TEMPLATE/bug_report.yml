name: Bug report
description: Report a reproducible issue in the app or gateway.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: App version, iPhone model and iOS version
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Remove keys, gateway tokens, personal data and precise worksite locations.
